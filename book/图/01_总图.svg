<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#37474f"/></marker>
    <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c62828"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="480" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#263238">一张总图：信号怎么走一圈</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#607d8b">黑箭头 = 一拍里的主线；红箭头 = 天生互惠返回线；绿箭头 = 闭环回到世界</text>

  <rect x="30" y="90" width="120" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="90" y="116" font-size="14" text-anchor="middle" fill="#0d47a1">外界 / 世界</text>
  <text x="90" y="134" font-size="11" text-anchor="middle" fill="#546e7a">画面 · 声音 · 身体</text>

  <line x1="150" y1="118" x2="196" y2="118" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="173" y="110" font-size="10" text-anchor="middle" fill="#546e7a">感觉</text>

  <rect x="200" y="90" width="140" height="56" rx="8" fill="#f1f8e9" stroke="#558b2f"/>
  <text x="270" y="114" font-size="14" text-anchor="middle" fill="#33691e">感觉接口</text>
  <text x="270" y="132" font-size="11" text-anchor="middle" fill="#546e7a">只翻译，不判断</text>

  <line x1="340" y1="118" x2="386" y2="118" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390" y="90" width="170" height="56" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="475" y="114" font-size="14" text-anchor="middle" fill="#e65100">前处理网络（多层）</text>
  <text x="475" y="132" font-size="11" text-anchor="middle" fill="#546e7a">环形邻域 · 权重出生固定 · 不学习</text>

  <line x1="560" y1="118" x2="606" y2="118" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="610" y="90" width="150" height="56" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="685" y="114" font-size="14" text-anchor="middle" fill="#1a237e">皮层感觉区</text>
  <text x="685" y="132" font-size="11" text-anchor="middle" fill="#546e7a">稀疏的一小撮细胞亮</text>

  <rect x="30" y="180" width="900" height="140" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-dasharray="6 4"/>
  <text x="46" y="202" font-size="13" font-weight="bold" fill="#37474f">皮层（一个平坦数组，区只是地址区间；所有区同一条方程、同一个节拍）</text>
  <rect x="50" y="214" width="140" height="42" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="120" y="240" font-size="13" text-anchor="middle" fill="#1a237e">视觉 / 听觉</text>
  <rect x="204" y="214" width="140" height="42" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="274" y="234" font-size="12" text-anchor="middle" fill="#1a237e">本体 / 前庭</text><text x="274" y="250" font-size="11" text-anchor="middle" fill="#78909c">身体状态</text>
  <rect x="358" y="214" width="140" height="42" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="428" y="234" font-size="12" text-anchor="middle" fill="#1a237e">运动记忆</text><text x="428" y="250" font-size="11" text-anchor="middle" fill="#78909c">时间细胞</text>
  <rect x="512" y="214" width="140" height="42" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="582" y="240" font-size="13" text-anchor="middle" fill="#1a237e">多巴胺</text>
  <rect x="666" y="214" width="120" height="42" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="726" y="240" font-size="13" text-anchor="middle" fill="#1a237e">运动</text>
  <rect x="800" y="214" width="110" height="42" rx="6" fill="#ffebee" stroke="#c62828"/><text x="855" y="234" font-size="12" text-anchor="middle" fill="#b71c1c">抑制池</text><text x="855" y="250" font-size="10" text-anchor="middle" fill="#78909c">不是负权重</text>
  <text x="46" y="282" font-size="12" fill="#546e7a">↑ 细胞是二值的（亮 / 不亮）· 一拍 20 毫秒 · 阈值 1.0 · 被抑制池压住就不亮</text>
  <text x="46" y="304" font-size="12" fill="#546e7a">↑ 运动区 160 个细胞 = 16 组肌肉 × 10 个；亮的个数就是力气（没有读出层、没有单独的推理步骤）</text>

  <rect x="330" y="348" width="300" height="62" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="480" y="373" font-size="15" font-weight="bold" text-anchor="middle" fill="#311b92">前额叶（第二级压缩机）</text>
  <text x="480" y="395" font-size="11" text-anchor="middle" fill="#546e7a">七路输入 → 三层前馈 → 只有输出层在皮层数组里</text>

  <line x1="480" y1="322" x2="480" y2="344" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="494" y="338" font-size="11" fill="#546e7a">七路（每路先按自己的半宽模糊一下）</text>

  <path d="M330,392 C170,392 120,336 120,300" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#r)"/>
  <text x="46" y="340" font-size="12" fill="#c62828">返回线：同一张表反着用</text>
  <text x="46" y="358" font-size="11" fill="#c62828">按各区自己峰值的 40%；</text>
  <text x="46" y="374" font-size="11" fill="#c62828">三个身体区只读不写</text>

  <line x1="630" y1="379" x2="700" y2="379" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="706" y="348" width="200" height="62" rx="8" fill="#e0f7fa" stroke="#00838f"/>
  <text x="806" y="373" font-size="14" text-anchor="middle" fill="#006064">运动输出</text>
  <text x="806" y="393" font-size="11" text-anchor="middle" fill="#546e7a">反向赫布网络 → 肌肉发力</text>

  <line x1="806" y1="410" x2="806" y2="432" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="706" y="434" width="200" height="50" rx="8" fill="#fce4ec" stroke="#ad1457"/>
  <text x="806" y="464" font-size="14" text-anchor="middle" fill="#880e4f">身体（物理引擎）</text>

  <path d="M906,459 L930,459 L930,72 L140,72 L140,84" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="770" y="502" font-size="12" fill="#2e7d32" text-anchor="middle">动作改变世界 → 新的感觉输入（闭环）</text>

  <rect x="30" y="518" width="300" height="62" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="180" y="540" font-size="13" text-anchor="middle" fill="#e65100">时间环（全系统唯一的时钟）</text>
  <text x="180" y="560" font-size="11" text-anchor="middle" fill="#546e7a">一格 0.05 秒 · 一帧 2 格 · 绕一圈 24 小时</text>

  <rect x="346" y="518" width="294" height="62" rx="8" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="493" y="540" font-size="13" font-weight="bold" text-anchor="middle" fill="#4a148c">唯一的学习规则（每拍都在跑）</text>
  <text x="493" y="560" font-size="11" text-anchor="middle" fill="#546e7a">涨 · 跌 · 新建　＋　四个护栏</text>

  <rect x="656" y="518" width="274" height="62" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="793" y="540" font-size="13" font-weight="bold" text-anchor="middle" fill="#263238">不装的三样东西</text>
  <text x="793" y="560" font-size="11" text-anchor="middle" fill="#c62828">没有奖励函数 · 反向传播 · 目标函数</text>
</svg>