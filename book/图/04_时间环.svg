<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#37474f"/></marker>
  <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker></defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#263238">时间环：全系统唯一的时钟，也是记忆的"挂衣钩"</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#607d8b">一格 0.05 秒 · 一帧 = 2 格 = 0.1 秒 · 绕一圈 = 24 小时 · 每一刻只有一个时间细胞亮</text>

  <!-- ring -->
  <circle cx="270" cy="270" r="150" fill="none" stroke="#ef6c00" stroke-width="3"/>
  <g fill="#fff3e0" stroke="#ef6c00" stroke-width="2">
    <circle cx="270" cy="120" r="17"/><circle cx="361" cy="145" r="17"/><circle cx="412" cy="220" r="17"/>
    <circle cx="412" cy="320" r="17"/><circle cx="361" cy="395" r="17"/><circle cx="270" cy="420" r="17"/>
    <circle cx="179" cy="395" r="17"/><circle cx="128" cy="320" r="17"/><circle cx="128" cy="220" r="17"/><circle cx="179" cy="145" r="17"/>
  </g>
  <text x="270" y="126" font-size="11" text-anchor="middle" fill="#e65100">1</text>
  <text x="361" y="151" font-size="11" text-anchor="middle" fill="#e65100">2</text>
  <text x="412" y="226" font-size="11" text-anchor="middle" fill="#e65100">3</text>
  <text x="412" y="326" font-size="11" text-anchor="middle" fill="#e65100">4</text>
  <text x="361" y="401" font-size="11" text-anchor="middle" fill="#e65100">5</text>
  <text x="270" y="426" font-size="11" text-anchor="middle" fill="#e65100">6</text>
  <text x="179" y="401" font-size="11" text-anchor="middle" fill="#e65100">7</text>
  <text x="128" y="326" font-size="11" text-anchor="middle" fill="#e65100">8</text>
  <text x="128" y="226" font-size="11" text-anchor="middle" fill="#e65100">9</text>
  <text x="179" y="151" font-size="11" text-anchor="middle" fill="#e65100">10</text>
  <path d="M300,105 A150,150 0 0 1 375,136" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#g)"/>
  <text x="270" y="258" font-size="14" text-anchor="middle" fill="#e65100">时间环</text>
  <text x="270" y="280" font-size="11" text-anchor="middle" fill="#607d8b">每刻只有一只灯亮</text>
  <text x="270" y="298" font-size="11" text-anchor="middle" fill="#607d8b">走一格 0.05 秒</text>

  <!-- write hook -->
  <rect x="510" y="110" width="410" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="530" y="136" font-size="13" font-weight="bold" fill="#1b5e20">规则①：把这一刻挂上去</text>
  <text x="530" y="158" font-size="12" fill="#37474f">这一帧亮着的特征细胞 → 下一格的时间细胞</text>
  <path d="M437,145 C470,145 490,145 506,145" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <!-- read hook -->
  <rect x="510" y="200" width="410" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="530" y="226" font-size="13" font-weight="bold" fill="#0d47a1">规则②：把这一刻读回来</text>
  <text x="530" y="248" font-size="12" fill="#37474f">这一格的时间细胞 → 下一帧的特征细胞</text>
  <path d="M506,235 C490,235 470,235 437,235" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <!-- three memory areas -->
  <rect x="510" y="292" width="410" height="96" rx="8" fill="#fafafa" stroke="#90a4ae"/>
  <text x="530" y="316" font-size="13" font-weight="bold" fill="#263238">三个记忆区，结构完全相同</text>
  <text x="530" y="340" font-size="12" fill="#37474f">视觉记忆 · 听觉记忆 · 运动记忆（记的是运动输出层每一帧的命令模式）</text>
  <text x="530" y="362" font-size="12" fill="#37474f">每个区都带两张表：特征 → 时间　和　时间 → 特征</text>
  <text x="530" y="382" font-size="12" fill="#c62828">前额叶不需要"索引"——顺序就长在它自己的权重里</text>

  <!-- recall -->
  <rect x="60" y="450" width="860" height="86" rx="8" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="80" y="476" font-size="13" font-weight="bold" fill="#4a148c">回忆 = 投票 + 沿环播放</text>
  <text x="80" y="500" font-size="12" fill="#37474f">给一组特征 → 各时间细胞按权重投票 → 票最多、而且明显领先（底票 80 / 领先 40）的那个时刻胜出 → 沿时间环连续播放后续帧</text>
  <text x="80" y="522" font-size="12" fill="#c62828">票不够就报"没见过"——"没见过"是一个合法答案，不许硬把噪声回放成一段记忆</text>
</svg>