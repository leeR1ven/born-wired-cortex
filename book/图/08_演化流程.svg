<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#37474f"/></marker>
        <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker></defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#263238">怎么造下一代：随机生成 → 考试 → 留种 → 融合</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#607d8b">改进只能靠"生得多、考得准、留得对"——不许手动调连接</text>

  <rect x="70" y="82" width="190" height="52" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="165" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">1 随机生成</text>
  <text x="165" y="122" font-size="11" text-anchor="middle" fill="#607d8b">--seeds 决定脚手架</text>
  <line x1="262" y1="108" x2="276" y2="108" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="280" y="82" width="190" height="52" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="375" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">2 考试</text>
  <text x="375" y="122" font-size="11" text-anchor="middle" fill="#607d8b">按题库考</text>
  <line x1="472" y1="108" x2="486" y2="108" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="490" y="82" width="190" height="52" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="585" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">3 留种</text>
  <text x="585" y="122" font-size="11" text-anchor="middle" fill="#607d8b">留下考得好的</text>
  <line x1="682" y1="108" x2="696" y2="108" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="700" y="82" width="190" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="795" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">4 融合 + 随机改</text>
  <text x="795" y="122" font-size="11" text-anchor="middle" fill="#607d8b">生下一代</text>
  <path d="M795,136 L795,154 L165,154 L165,136" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="480" y="172" font-size="11" text-anchor="middle" fill="#2e7d32">一代接一代（回到第 1 步）</text>

  <rect x="40" y="188" width="440" height="132" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="60" y="212" font-size="13" font-weight="bold" fill="#1b5e20">② 融合：一大堆好的模型一起合，也行</text>
  <rect x="60" y="226" width="160" height="26" fill="#a5d6a7" stroke="#2e7d32"/>
  <rect x="220" y="226" width="160" height="26" fill="#90caf9" stroke="#1565c0"/>
  <rect x="380" y="226" width="80" height="26" fill="#ffe082" stroke="#f9a825"/>
  <text x="140" y="244" font-size="11" text-anchor="middle" fill="#1b5e20">随 A 40%</text>
  <text x="300" y="244" font-size="11" text-anchor="middle" fill="#0d47a1">随 B 40%</text>
  <text x="420" y="244" font-size="11" text-anchor="middle" fill="#e65100">平均 20%</text>
  <text x="60" y="278" font-size="12" fill="#37474f">一个数字一个数字地随机决定随谁（也可以取两者平均）</text>
  <text x="60" y="300" font-size="12" fill="#37474f">之后：随机改几个数字 —— 随机性撒大一点（原来只从单亲抄，后补成"一半孩子两爹融合"）</text>

  <rect x="490" y="188" width="430" height="132" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="510" y="212" font-size="13" font-weight="bold" fill="#e65100">③ 少生多迭代，不要多生少迭代</text>
  <text x="510" y="236" font-size="12" fill="#37474f">5,000 只 × 每只差 1% × 一代慢</text>
  <text x="510" y="256" font-size="12" fill="#37474f">几百只 × 每只差 10% × 一代快</text>
  <text x="510" y="280" font-size="12" fill="#c62828">实测：一代 24 只 → 追住 0 只</text>
  <text x="510" y="300" font-size="12" fill="#2e7d32">改成每代 300 只 → 才追得住</text>

  <rect x="40" y="336" width="440" height="158" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="60" y="360" font-size="13" font-weight="bold" fill="#0d47a1">④ 两层题库：整套流程能跑起来的关键</text>
  <text x="60" y="384" font-size="12" fill="#37474f">便宜题 → 用来筛选（先剔掉大部分）</text>
  <text x="60" y="404" font-size="12" fill="#37474f">贵题 → 用来录取（只考少数候选）</text>
  <text x="60" y="428" font-size="12" fill="#37474f">10 秒走路题：15.3 秒 → 9.3 秒</text>
  <text x="60" y="448" font-size="12" fill="#2e7d32">24 个候选筛选：342 秒 → 19 秒（18 倍）</text>
  <text x="60" y="472" font-size="12" fill="#c62828">130 道题全库：出生动物 26.8 分钟；1,000 只 = 447 小时 → 否决</text>

  <rect x="490" y="336" width="430" height="158" rx="8" fill="#fce4ec" stroke="#ad1457"/>
  <text x="510" y="360" font-size="13" font-weight="bold" fill="#880e4f">⑤ 判"真会"必须多两步</text>
  <text x="510" y="384" font-size="12" fill="#37474f">① 换没见过的位置复考</text>
  <text x="510" y="404" font-size="12" fill="#37474f">② 搬走刺激做对照：</text>
  <text x="528" y="424" font-size="12" fill="#c62828">落点差 &lt; 0.05 米 ⇒ 它没在看球，是碰巧</text>
  <text x="510" y="452" font-size="12" fill="#37474f">只考"考过的位置" ⇒ 会把碰巧当能力</text>
  <text x="510" y="476" font-size="12" fill="#607d8b">两步都做完，才敢写"它会追球"</text>

  <rect x="40" y="510" width="880" height="94" rx="8" fill="#f7f9fc" stroke="#cfd8dc"/>
  <text x="60" y="534" font-size="13" font-weight="bold" fill="#263238">⑥ 两条必须记住的</text>
  <text x="60" y="558" font-size="12" fill="#c62828">· --seeds 0,1,2 是"三只不同的动物"，不是同一只测三次 —— 报告只能写"三个种子的结果分别是…"</text>
  <text x="60" y="580" font-size="12" fill="#37474f">· 新机制只做验证实验，不重跑全库；抑制"连谁、发到哪、压多重"这类参数交给大批量训练去定</text>
  <text x="60" y="598" font-size="12" fill="#37474f">· 动作库那 221 条是从另训的强化学习策略里蒸馏出来的 —— 这件事发生在出生之前</text>
</svg>